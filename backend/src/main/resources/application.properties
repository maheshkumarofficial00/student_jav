# ============================================================
# Smart Faculty and Resource Booking System – Spring Boot
# ============================================================

# Server
server.port=${SERVER_PORT:8081}

# ---- MySQL Database Configuration ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:srmap_booking}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Disable automatic SQL script execution on startup (schema managed by Hibernate ddl-auto=update)
spring.sql.init.mode=never

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# IMPORTANT: Replace with a strong random 256-bit (32+ byte) secret before deploying.
app.jwt.secret=SrmapBookingSystemSecretKey2024ChangeThisInProductionToALongRandomString
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Frontend origin. Adjust if the frontend is served from a different host/port.
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://localhost:8081,null

# ---- Availability limits ----
app.max-search-days=14
